name: Release
on:
  push:
    tags:
      - "v*"
  # Versionado lo dispara con workflow_dispatch tras crear el tag (un push
  # con GITHUB_TOKEN no encadenaría workflows) y permite reintentos a mano.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: SOURCE_DATE_EPOCH desde el commit del tag
        run: |
          set -euo pipefail
          # Fecha del commit apuntado por el tag/ref. No afirma builds bit a bit
          # (el tarball de GitHub no es reproducible); solo alinea marcas de tiempo.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: El tag debe coincidir con todas las fuentes de versión
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            local name="$1" file="$2" actual="$3"
            echo "$name: $actual (tag: $TAG)"
            [ "$actual" = "$TAG" ] || fail=1
          }
          check cargo   Cargo.toml              "$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          check gui     gui/__init__.py         "$(grep -m1 '^__version__' gui/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')"
          check pkbuild packaging/aur/PKGBUILD "$(grep -m1 '^pkgver=' packaging/aur/PKGBUILD | sed -E 's/pkgver=//')"
          [ "$fail" = 0 ] || { echo "El tag v$TAG no coincide con alguna fuente de versión"; exit 1; }
      - name: Verificar paridad Cargo npm tag CHANGELOG
        run: bash scripts/check-version.sh
      - run: cargo test --locked -- --test-threads=1
      - run: cargo build --locked --release
      - name: Árbol sin cambios tras build --locked
        run: git diff --exit-code
      - name: GUI py_compile
        run: python3 -m py_compile gui/*.py
      - name: Suite Python (alineada con quality de CI)
        env:
          ILUTEX_REQUIRE_DBUS: "1"
          # Misma señal que quality (KBC-31): no deshacer al rebasear sobre #43.
          ILUTEX_REQUIRE_GUI_SUITE: "1"
          ILUTEX_GUI_TESTS: "1"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi \
            gir1.2-glib-2.0 \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            dbus \
            xvfb
          python3 -c "from gi.repository import Gio, GLib; print('GLib', GLib.MAJOR_VERSION, GLib.MINOR_VERSION)"
          python3 -c "import gi; gi.require_version('Gtk', '4.0'); gi.require_version('Adw', '1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw OK')"
          GDK_BACKEND=x11 xvfb-run -a python3 -m unittest discover -s gui/tests -v
      - run: bash scripts/smoke.sh
      - name: Instalar herramientas de empaquetado
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-cyclonedx --locked
      - name: Empaquetar
        run: |
          VER="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          DIST="ilutex-v${VER}-linux-x86_64"
          mkdir -p "dist/${DIST}"
          cp target/release/ilutex "dist/${DIST}/"
          mkdir -p "dist/${DIST}/gui"
          cp gui/*.py "dist/${DIST}/gui/"
          cp packaging/ilutex-gui "dist/${DIST}/ilutex-gui"
          chmod +x "dist/${DIST}/ilutex-gui"
          cp -r packaging "dist/${DIST}/"
          cp README.md LICENSE CHANGELOG.md "dist/${DIST}/"
          (cd "dist/${DIST}" && sha256sum ilutex ilutex-gui > SHA256SUMS)
          tar -czf "dist/${DIST}.tar.gz" -C dist "${DIST}"
      - name: Generar .mo (i18n para el .deb)
        run: |
          command -v msgfmt >/dev/null 2>&1 || sudo apt-get install -y gettext
          for po in po/*.po; do
            lang=$(basename "$po" .po)
            mkdir -p "gui/locale/$lang/LC_MESSAGES"
            msgfmt -o "gui/locale/$lang/LC_MESSAGES/ilutex.mo" "$po"
          done
          python3 scripts/check-i18n.py
      - name: Construir .deb (cargo-deb)
        run: cargo deb --no-build
      - name: Generar SBOM (CycloneDX)
        run: cargo cyclonedx --format json --override-filename sbom
      - name: Reunir artefactos y SHA256SUMS
        run: |
          cp target/debian/*.deb dist/
          cp sbom.json dist/
          (cd dist && sha256sum ./*.tar.gz ./*.deb sbom.json > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -la dist/
      - name: Firmar SHA256SUMS (GPG)
        env:
          ILUTEX_RELEASE_GPG_KEY: ${{ secrets.ILUTEX_RELEASE_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ILUTEX_RELEASE_GPG_KEY}" ]; then
            echo "::error::Falta el secret ILUTEX_RELEASE_GPG_KEY; no se publica SHA256SUMS sin firma."
            exit 1
          fi
          # Importa la clave privada de release (ASCII-armor en el secret).
          # Debe ser un par sin passphrase: no hay secret de PIN en el runner.
          printf '%s\n' "$ILUTEX_RELEASE_GPG_KEY" | gpg --batch --import
          FPR="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          if [ -z "${FPR}" ]; then
            echo "::error::No se obtuvo fingerprint tras importar ILUTEX_RELEASE_GPG_KEY."
            exit 1
          fi
          if ! gpg --batch --yes --pinentry-mode loopback --local-user "$FPR" \
            --detach-sign --armor --output dist/SHA256SUMS.asc dist/SHA256SUMS
          then
            echo "::error::Fallo al firmar SHA256SUMS (¿clave con passphrase? CI no soporta PIN)."
            exit 1
          fi
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/sbom.json
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
